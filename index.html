<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f11" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Redmoor: Break Out — a two-player online co-op prison escape action-adventure." />
  <title>Redmoor: Break Out</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <style>
    html, body { margin: 0; height: 100%; background: #0d0f11; color: #ece7dc; font-family: system-ui, sans-serif; overflow: hidden; }
    .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .boot .logo { font-size: 48px; letter-spacing: .12em; font-weight: 700; } .boot .logo span { color: #e07a2e; }
    .boot .bar { width: 240px; height: 3px; background: rgba(255,255,255,.1); margin-top: 18px; } .boot .bar i { display: block; height: 100%; width: 0; background: #e07a2e; }
    .boot .msg { margin-top: 10px; font-size: 12px; color: #9a9b97; letter-spacing: .08em; text-transform: uppercase; }
    .rotate-hint { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <div class="boot" id="boot">
      <div class="logo">REDMOOR<span>.</span></div>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="msg" id="boot-msg">Loading</div>
    </div>
    <div class="rotate-hint" id="rotate-hint">
      <div class="ph"></div>
      <div>Tip: turn your phone sideways for a bigger view</div>
      <div class="skip" id="rotate-skip">✕</div>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
