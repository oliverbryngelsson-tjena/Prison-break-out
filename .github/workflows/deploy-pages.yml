# Builds the game client and publishes it to GitHub Pages.
# Online play works with no setup: the player who creates a room hosts it in their browser and the
# partner connects peer-to-peer (WebRTC, introduced by the free PeerJS signaling service).
# Optional: to use a dedicated room server instead, deploy server/ (see README) and set the repository
# variable GAME_SERVER_URL (Settings > Secrets and variables > Actions > Variables), e.g. wss://your-server.example.com
name: Deploy client to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
        env:
          VITE_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
          VITE_NET_MODE: p2p
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
